services:
  - type: web
    name: lms-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lms-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://your-app.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://your-app.vercel.app
      - key: MAIL_SENDER
        sync: false
      - key: MAIL_PASSWORD
        sync: false

databases:
  - name: lms-db
    plan: free
    databaseName: lms
